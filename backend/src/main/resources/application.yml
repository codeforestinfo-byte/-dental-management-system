server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: dentaflow-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/dentaflow
    username: ${DB_USERNAME:dentaflow}
    password: ${DB_PASSWORD:dentaflow_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25
          fetch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:dentaflow-super-secret-key-that-is-at-least-256-bits-long-for-hs256}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
  token-prefix: "Bearer "
  header: Authorization

app:
  name: DentaFlow
  dental-clinic:
    name: Sunrise Dental
    address: 123 Dental Street, Medical City
    phone: +94-11-2345678
    email: info@sunrisedental.lk
  appointment:
    number-prefix: APT
    slot-duration-minutes: 30

logging:
  level:
    root: INFO
    com.dentaflow: DEBUG
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
